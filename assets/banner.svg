)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes pulseBadge{0%{transform:scale(1);opacity:.95}50%{transform:scale(1.03);opacity:1}}.orb-indigo{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-cyan{animation:pulseOrb 10s ease-in-out infinite reverse;transform-origin:1000px 300px}.card-anim-1{animation:floatCard1 6s ease-in-out infinite}.card-anim-2{animation:floatCard2 7s ease-in-out infinite}.data-flow{stroke-dasharray:6,6;animation:dashStream 2s linear infinite}.badge-pulse{animation:pulseBadge 4s ease-in-out infinite;transform-origin:center}</style><rect width="1200" height="420" fill="url(#bg-grad)" rx="12"/><rect width="1200" height="420" fill="url(#grid)" rx="12"/><circle cx="200" cy="120" r="160" fill="#6366f1" class="orb-indigo" filter="url(#glow-indigo)"/><circle cx="1020" cy="280" r="150" fill="#06b6d4" class="orb-cyan" filter="url(#glow-cyan)"/><path fill="none" stroke="#6366f1" stroke-opacity=".4" stroke-width="2" d="M 50 360 C 300 360, 400 390, 700 370 C 950 350, 1050 380, 1150 360" class="data-flow"/><path fill="none" stroke="#06b6d4" stroke-opacity=".3" stroke-width="1.5" d="M 50 60 C 250 80, 450 40, 750 70 C 980 100, 1080 50, 1150 70" class="data-flow"/><g class="card-anim-1" filter="url(#card-shadow)" opacity=".85" transform="translate(60, 120)"><rect width="210" height="150" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" rx="10"/><circle cx="24" cy="24" r="6" fill="#ef4444" opacity=".8"/><circle cx="40" cy="24" r="6" fill="#f59e0b" opacity=".8"/><circle cx="56" cy="24" r="6" fill="#10b981" opacity=".8"/><text x="24" y="58" fill="#94a3b8" font-size="11" font-weight="600">ROLE HIERARCHY</text><rect width="162" height="20" x="24" y="70" fill="#312e81" opacity=".6" rx="4"/><text x="32" y="84" fill="#a5b4fc" font-size="10" font-weight="600">👑 Billing Admin</text><rect width="162" height="20" x="24" y="96" fill="#1e293b" rx="4"/><text x="32" y="110" fill="#cbd5e1" font-si