<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" style="background:#0b0f19; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Filters for Glow -->
    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseOrb {
      0% { opacity: 0.35; transform: scale(1) translate(0px, 0px); }
      50% { opacity: 0.65; transform: scale(1.15) translate(20px, -15px); }
      100% { opacity: 0.35; transform: scale(1) translate(0px, 0px); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }
    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.03); opacity: 1; }
    }

    .orb-indigo { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-cyan { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .card-anim-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-anim-2 { animation: floatCard2 7s ease-in-out infinite; }
    .data-flow { stroke-dasharray: 6, 6; animation: dashStream 2s linear infinite; }
    .badge-pulse { animation: pulseBadge 4s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="12" />
  <rect width="1200" height="420" fill="url(#grid)" rx="12" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <circle class="orb-indigo" cx="200" cy="120" r="160" fill="#6366f1" filter="url(#glow-indigo)" />
  <circle class="orb-cyan" cx="1020" cy="280" r="150" fill="#06b6d4" filter="url(#glow-cyan)" />

  <!-- Subtle Dynamic Data Streams / Flows -->
  <path class="data-flow" d="M 50 360 C 300 360, 400 390, 700 370 C 950 350, 1050 380, 1150 360" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" />
  <path class="data-flow" d="M 50 60 C 250 80, 450 40, 750 70 C 980 100, 1080 50, 1150 70" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Background Decorative Architecture Cards (Placed safely away from center text) -->
  <!-- Left Side: Role Hierarchy Snippet -->
  <g class="card-anim-1" transform="translate(60, 120)" opacity="0.85" filter="url(#card-shadow)">
    <rect width="210" height="150" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="24" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="24" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="56" cy="24" r="6" fill="#10b981" opacity="0.8"/>
    <text x="24" y="58" fill="#94a3b8" font-size="11" font-weight="600">ROLE HIERARCHY</text>
    <rect x="24" y="70" width="162" height="20" rx="4" fill="#312e81" opacity="0.6"/>
    <text x="32" y="84" fill="#a5b4fc" font-size="10" font-weight="600">👑 Billing Admin</text>
    <rect x="24" y="96" width="162" height="20" rx="4" fill="#1e293b" />
    <text x="32" y="110" fill="#cbd5e1" font-size="10">💳 Finance Executive</text>
    <rect x="24" y="122" width="162" height="20" rx="4" fill="#1e293b" />
    <text x="32" y="136" fill="#94a3b8" font-size="10">👁️ Audit / Read-Only</text>
  </g>

  <!-- Right Side: Authorization Decision Card -->
  <g class="card-anim-2" transform="translate(930, 120)" opacity="0.85" filter="url(#card-shadow)">
    <rect width="210" height="150" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="24" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="24" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="56" cy="24" r="6" fill="#10b981" opacity="0.8"/>
    <text x="24" y="58" fill="#94a3b8" font-size="11" font-weight="600">ACCESS DECISION</text>
    <rect x="24" y="70" width="162" height="22" rx="4" fill="#064e3b" opacity="0.5"/>
    <text x="32" y="85" fill="#34d399" font-size="10" font-weight="700">✓ ALLOW: invoice.refund</text>
    <rect x="24" y="98" width="162" height="22" rx="4" fill="#450a0a" opacity="0.5"/>
    <text x="32" y="113" fill="#f87171" font-size="10" font-weight="700">✕ DENY: plan.delete</text>
    <rect x="24" y="126" width="162" height="16" rx="4" fill="#0f172a" />
    <text x="32" y="138" fill="#64748b" font-size="9">Latency: 2.4ms (Zanzibar)</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed high visibility and never obscured) -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Top Pill / Category Tag -->
    <g class="badge-pulse">
      <rect x="-170" y="0" width="340" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
      <circle cx="-146" cy="15" r="5" fill="#10b981" />
      <text x="-132" y="20" fill="#c7d2fe" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0.5">FINE-GRAINED AUTHORIZATION &amp; IAM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="82" fill="url(#primary-grad)" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#card-shadow)">
      Awesome Billing RBAC
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="120" fill="#f8fafc" font-size="19" font-weight="600" letter-spacing="0.2">
      Role-Based Access Control for Cloud Billing &amp; SaaS Finance
    </text>

    <!-- Secondary Explanatory Subtitle -->
    <text x="0" y="150" fill="#94a3b8" font-size="14" font-weight="400">
      Curated Authorization Engines • Policy-as-Code • Zanzibar ReBAC • Least-Privilege Separation
    </text>

    <!-- Feature Pills in Center Foreground -->
    <g transform="translate(0, 185)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="0" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="70" y="18" fill="#e2e8f0" font-size="11.5" font-weight="600" text-anchor="middle">🛡️ Zero-Trust IAM</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-75, 0)">
        <rect x="0" y="0" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="75" y="18" fill="#e2e8f0" font-size="11.5" font-weight="600" text-anchor="middle">⚡ Zanzibar Engines</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(90, 0)">
        <rect x="0" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="70" y="18" fill="#e2e8f0" font-size="11.5" font-weight="600" text-anchor="middle">📜 Policy as Code</text>
      </g>
    </g>
  </g>
</svg>
